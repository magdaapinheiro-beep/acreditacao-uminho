# Sempre que o levantamento (ou os dados, os PDF, o modelo ou os scripts)
# muda no GitHub, refaz a página e grava-a no repositório. O GitHub Pages publica-a.
# O relatório de verificação (links em falta, links trocados, correções
# aplicadas, ciclos retirados) fica no resumo de cada execução, no separador Actions.
name: Gerar página

on:
  push:
    branches: [main]
    paths:
      - "fontes/**"
      - "deliberacoes/**"
      - "dados.csv"
      - "institucional.csv"
      - "correcoes.csv"
      - "template.html"
      - "logo_uminho.png"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verificar os dados e refazer a página
        env:
          TZ: Europe/Lisbon
        run: |
          set -o pipefail
          python3 atualizar.py | tee relatorio.txt
          python3 publicar_web.py
          { echo '### Relatório da atualização'; echo '```'; cat relatorio.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Gravar a página e os dados se mudaram
        run: |
          git add index.html dados.csv institucional.csv
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualizar página a partir do levantamento"
            git push
          fi
