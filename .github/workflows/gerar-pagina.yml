# Sempre que o Excel (ou o modelo, o logótipo ou os scripts) muda no GitHub,
# regenera o index.html e grava-o no repositório. O GitHub Pages publica-o.
name: Gerar página

on:
  push:
    branches: [main]
    paths:
      - "dados/**"
      - "modelo/**"
      - "assets/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 scripts/gerar_pagina.py
      - name: Gravar index.html se mudou
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Regenerar index.html a partir do Excel"
            git push
          fi
